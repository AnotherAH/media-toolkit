# Pushing a tag like v1.2.0 builds the Windows release and puts it on a DRAFT
# GitHub release: installer, portable zip and SHA256SUMS.txt, with the notes
# taken from the matching CHANGELOG.md section. A person reviews the draft and
# publishes it; nothing here publishes on its own.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-dev.txt
            requirements-lock.txt

      - name: Check the tag matches the app version
        id: version
        run: |
          $version = python tools/build.py --print-version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            Write-Error "Tag $env:GITHUB_REF_NAME does not match __version__ = $version in app/__init__.py"
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Release notes from CHANGELOG.md
        run: python tools/release_notes.py ${{ steps.version.outputs.version }} release-notes.md

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt -r requirements-dev.txt -c requirements-lock.txt

      # The pinned ffmpeg the installer ships; the tests that need a real
      # ffmpeg run against it instead of skipping.
      - name: Fetch ffmpeg
        run: python tools/fetch_ffmpeg.py

      - name: Run tests
        run: python -m pytest -q

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer and portable zip
        run: python tools/build.py

      - uses: actions/upload-artifact@v7
        with:
          name: media-toolkit-${{ steps.version.outputs.version }}
          path: |
            dist/MediaToolkit-Setup-*.exe
            dist/MediaToolkit-*-portable.zip
            dist/SHA256SUMS.txt
          retention-days: 14

      - name: Create or update the draft release
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = $env:GITHUB_REF_NAME
          $title = "Media Toolkit $version"
          $files = @("dist/MediaToolkit-Setup-$version.exe",
                     "dist/MediaToolkit-$version-portable.zip",
                     "dist/SHA256SUMS.txt")
          foreach ($f in $files) { if (-not (Test-Path $f)) { Write-Error "missing $f"; exit 1 } }
          $draft = gh release view $tag --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag @files --draft --verify-tag --title $title --notes-file release-notes.md
          } elseif ($draft -eq "true") {
            gh release edit $tag --title $title --notes-file release-notes.md
            gh release upload $tag @files --clobber
          } else {
            Write-Error "Release $tag is already published. Bump the version and tag again."
            exit 1
          }
