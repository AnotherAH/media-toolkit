# Tests on every push and pull request, on the platform the app ships for.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt -c requirements-lock.txt

      # The pinned build the installer ships (tools/fetch_ffmpeg.py checks its
      # SHA-256); without it the tests that need a real ffmpeg are skipped.
      - name: Fetch ffmpeg
        run: python tools/fetch_ffmpeg.py

      - name: Run tests
        run: python -m pytest -q
