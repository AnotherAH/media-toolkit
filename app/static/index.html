<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151a21">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="mt-token" content="">
<title>Media Toolkit</title>
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/download.css">
<link rel="stylesheet" href="/static/css/transcript.css">
<link rel="stylesheet" href="/static/css/live.css">
<link rel="stylesheet" href="/static/css/queue.css">
<link rel="stylesheet" href="/static/css/settings.css">
<link rel="stylesheet" href="/static/css/wizard.css">
<script src="/static/js/boot.js"></script>
<script type="module" src="/static/js/main.js"></script>
</head>
<body>

<svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v15M18.5 12.5 12 19l-6.5-6.5"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16.5v-5M12 8h.01"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 4 2.6 17.5A2 2 0 0 0 4.3 20.5h15.4a2 2 0 0 0 1.7-3L13.7 4a2 2 0 0 0-3.4 0Z"/><path d="M12 9.5v4M12 17h.01"/></symbol>
  <symbol id="i-rec-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-stop-square" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7.5 5.2v13.6a1 1 0 0 0 1.5.9l10.9-6.8a1 1 0 0 0 0-1.8L9 4.3a1 1 0 0 0-1.5.9Z"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2.2 2.2h7.3A2.5 2.5 0 0 1 21 9.7v7.8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5Z"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="12" height="12" rx="2"/><path d="M15.5 8.5V5.5a2 2 0 0 0-2-2h-8a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><rect x="2.5" y="6" width="13" height="12" rx="2"/><path d="m15.5 10.5 6-3.5v10l-6-3.5"/></symbol>
  <symbol id="i-audio" viewBox="0 0 24 24"><path d="M9 18V5.5l11-2V16"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></symbol>
  <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></symbol>
  <symbol id="i-captions" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15h3.5M13.5 15H17M7 11h10"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5L5 20"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
  <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
  <symbol id="i-spinner" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.2-8.56"/></symbol>
  <symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.8" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-scissors" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M6.5 9.5 12 4l5.5 5.5M5 20h14"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
  <symbol id="i-retry" viewBox="0 0 24 24"><path d="M20 11.5A8 8 0 1 1 17.7 6"/><path d="M20 4v5h-5"/></symbol>
  <!-- Navigation (V-11) -->
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3.5v12M6.5 10 12 15.5 17.5 10M5 20.5h14"/></symbol>
  <symbol id="i-record" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-queue" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
</svg>

<header class="topbar">
  <div class="topbar-inner">
    <div class="logo"><img src="/static/icon.svg" width="20" height="20" alt=""><span class="logo-text">Media Toolkit</span></div>
    <nav class="tabs" aria-label="Sections">
      <button type="button" data-tab="download" aria-current="page" title="Download (Ctrl+1)"><svg class="i" aria-hidden="true"><use href="#i-download"/></svg><span>Download</span></button>
      <button type="button" data-tab="transcript" title="Transcript (Ctrl+2)"><svg class="i" aria-hidden="true"><use href="#i-text"/></svg><span>Transcript</span><span class="tab-dot" aria-hidden="true" hidden></span></button>
      <button type="button" data-tab="live" title="Live (Ctrl+3)"><svg class="i" aria-hidden="true"><use href="#i-record"/></svg><span>Live</span><span class="badge rec" aria-hidden="true" hidden></span></button>
      <button type="button" data-tab="queue" title="Queue (Ctrl+4)"><svg class="i" aria-hidden="true"><use href="#i-queue"/></svg><span>Queue</span><span class="badge" aria-hidden="true" hidden></span></button>
      <button type="button" data-tab="settings" title="Settings (Ctrl+5)"><svg class="i" aria-hidden="true"><use href="#i-settings"/></svg><span>Settings</span></button>
    </nav>
    <span class="spacer"></span>
    <button type="button" id="statusChip" class="status-chip" hidden></button>
  </div>
</header>

<main id="main" class="main">
  <div id="appBanner" class="app-banner" hidden></div>
  <section id="tab-download" class="tab" data-tab="download" aria-label="Download"></section>
  <section id="tab-transcript" class="tab" data-tab="transcript" aria-label="Transcript" hidden></section>
  <section id="tab-live" class="tab" data-tab="live" aria-label="Live" hidden></section>
  <section id="tab-queue" class="tab" data-tab="queue" aria-label="Queue" hidden></section>
  <section id="tab-settings" class="tab" data-tab="settings" aria-label="Settings" hidden></section>
</main>

<div id="toasts" class="toasts" role="region" aria-label="Notifications"></div>
<div id="announcer" class="sr-only" aria-live="polite"></div>

<div id="dropOverlay" class="drop-overlay" hidden>
  <div class="drop-panel">
    <svg class="i" aria-hidden="true"><use href="#i-upload"/></svg>
    <div class="drop-title">Drop to transcribe</div>
    <div class="drop-count" id="dropCount"></div>
  </div>
</div>

<div id="dialogs"></div>
</body>
</html>
